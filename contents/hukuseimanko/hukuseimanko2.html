<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="../../assets/css/pages.css">

</head>

<body>
  <div>
    <a href="../../folder/hukuseimanko.html">
      <h1>戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================
 
  const title = "複製マ〇コ2 ~真面目なマ〇コ編~";

  const start = 0;
  const end = 53;

  const baseURL = "https://cdn-doumura.com/2024:12:12:04:42:01/";
  const suffix = ".webp";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const url = `${baseURL}${i}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
