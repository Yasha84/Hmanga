<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="../assets/css/pages.css">

</head>

<body>
  <div>
    <a href="../">
      <h1>トップへ戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================

  const title = "迷子のお知らせです";

  const start = 1;
  const end = 20;
  const zeroNum = 5;

  const baseURL = "https://alaya-travels.ru/german-porno-deutsch/wp-content/uploads/2019/07/20/W085mKPa2hwwzYaC/"
  const suffix = ".jpg";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const numStr = String(i).padStart(zeroNum, '0');
    const url = `${baseURL}${numStr}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
