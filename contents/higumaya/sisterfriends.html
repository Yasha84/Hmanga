<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="/assets/css/pages.css">

</head>

<body>
  <div>
    <a href="/folder/higumaya.html">
      <h1>戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================

  const title = "お姉ちゃんの友達がエッチな人ばかりだったから";

  const start = 1;
  const end = 30;
  const zeroNum = 5;

  const baseURL = "https://cdn-msp.18-comicblade.vip/media/photos/140952/"
  const suffix = ".webp";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const numStr = String(i).padStart(zeroNum, '0');
    const url = `${baseURL}${numStr}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
