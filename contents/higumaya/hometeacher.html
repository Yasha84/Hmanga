<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="../../assets/css/pages.css">

</head>

<body>
  <div>
    <a href="../../folder/higumaya.html">
      <h1>戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================
 
  const title = "おっぱいを触らせてくれる家庭教師のお姉さんの話";

  const start = 1;
  const end = 31;

  const baseURL = "https://i3.nhentai.net/galleries/1125361/";
  const suffix = ".jpg";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const url = `${baseURL}${i}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
