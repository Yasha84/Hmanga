<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="/assets/css/pages.css">

</head>

<body>
  <div>
    <a href="../">
      <h1>トップへ戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================
 
  const title = "寝てる間体を自由に使わせてくれるクラスメイトの森田さん";

  const start = 1;
  const end = 34;
  const zeroNum = 3;

  const baseURL = "https://img.momoniji.com/wp-content/uploads/a/43/4387/d_438729/neteru_"
  const suffix = ".webp";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const numStr = String(i).padStart(zeroNum, '0');
    const url = `${baseURL}${numStr}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
