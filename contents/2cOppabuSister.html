<!DOCTYPE html>

<html>

<head>
  <base target="_top">

  <title id="pageTitle"></title>

  <!-- css適用 -->
  <link rel="stylesheet" href="/assets/css/pages.css">

</head>

<body>
  <div>
    <a href="../">
      <h1>トップへ戻る</h1>
    </a>

    <div id="box"></div>

  </div>
</body>

<script>
  // ========================================
 
  const title = "2年C組学園おっぱぶのキャストに妹がいた";

  const start = 1;
  const end = 44;

  const baseURL = "https://i5.nhentaimg.com/017/vr86tfzsuw/";
  const suffix = ".webp";

  // ========================================

  document.getElementById("pageTitle").textContent = title;

  const box = document.getElementById("box");

  for (let i = start; i <= end; i++) {
    const url = `${baseURL}${i}${suffix}`;
    const imgHTML = `<img src="${url}">`;

    box.insertAdjacentHTML("beforeend", imgHTML);
  }
</script>

</html>
